<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Edukasi Bahaya Narkoba</title>
    <style>
        :root {
            --bg-main-gradient: linear-gradient(135deg, rgba(122, 12, 16, 0.92) 0%, rgba(74, 5, 18, 0.95) 55%, rgba(36, 4, 15, 0.98) 100%);
            --bg-card-gradient: linear-gradient(145deg, rgba(97, 10, 13, 0.85) 0%, rgba(48, 4, 10, 0.9) 100%);
            --bg-darker: #1a0208;
            --accent-gold: #f3d068;
            --accent-gold-hover: #ffdf7e;
            --text-light: #f8f9fa;
            --text-muted: #dcdcdc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-darker);
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(224, 176, 128, 0.14) 0%, transparent 45%),
                radial-gradient(circle at 85% 75%, rgba(158, 22, 45, 0.25) 0%, transparent 50%),
                linear-gradient(160deg, #2b0308 0%, #140106 50%, #240412 100%);
            background-attachment: fixed;
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-x: hidden;
        }

        header {
            background: linear-gradient(135deg, #e0b080 0%, #b58456 50%, #8c5d38 100%);
            color: #2b1d11;
            padding: 18px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 4px solid var(--bg-darker);
            box-shadow: 0 6px 25px rgba(0,0,0,0.7);
            position: relative;
            z-index: 10;
        }

        .header-title-box {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        header h1 {
            font-family: 'Georgia', serif;
            font-size: clamp(1.2rem, 3vw, 2rem);
            letter-spacing: 1.2px;
            text-transform: uppercase;
            text-shadow: 0 1px 2px rgba(255,255,255,0.4);
        }

        .user-welcome-badge {
            background: linear-gradient(135deg, #380507 0%, #1a0208 100%);
            color: var(--accent-gold);
            padding: 8px 16px;
            border-radius: 25px;
            font-size: 0.85rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid rgba(243, 208, 104, 0.45);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3), inset 0 1px 3px rgba(255,255,255,0.1);
        }

        .main-container {
            flex: 1;
            background: 
                radial-gradient(circle at top right, rgba(243, 208, 104, 0.08) 0%, transparent 45%),
                radial-gradient(circle at bottom left, rgba(180, 25, 45, 0.18) 0%, transparent 50%),
                var(--bg-main-gradient);
            padding: 25px;
            padding-bottom: 95px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            border-left: 1px solid rgba(255, 255, 255, 0.05);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.6);
        }

        .section-content {
            display: none;
        }

        .section-content.active {
            display: block;
            animation: fadeIn 0.35s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .dashboard-stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 18px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: var(--bg-card-gradient);
            backdrop-filter: blur(8px);
            border-radius: 14px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
        }

        .stat-card:hover {
            transform: translateY(-3px);
            border-color: rgba(243, 208, 104, 0.5);
            box-shadow: 0 10px 25px rgba(243, 208, 104, 0.12);
        }

        .stat-icon {
            font-size: 2rem;
            background: linear-gradient(135deg, #420608 0%, #1c0208 100%);
            width: 55px;
            height: 55px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 2px 4px rgba(255,255,255,0.1);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .stat-info h4 {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-info .stat-num {
            font-size: 1.4rem;
            font-weight: bold;
            color: var(--accent-gold);
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        @media (min-width: 768px) {
            .dashboard-grid {
                grid-template-columns: 330px 1fr;
            }
        }

        .card {
            background: var(--bg-card-gradient);
            backdrop-filter: blur(8px);
            border-radius: 16px;
            padding: 22px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.45);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .profile-summary-card {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .avatar-circle {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f5d77f 0%, #c49c31 100%);
            color: #2b1d11;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: bold;
            border: 3px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 6px 15px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .avatar-circle img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .change-avatar-btn {
            background: linear-gradient(135deg, #e0b080 0%, #9c714d 100%);
            color: #2b1d11;
            border: 1px solid rgba(255, 255, 255, 0.25);
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
        }

        .avatar-large {
            width: 110px;
            height: 110px;
            font-size: 2.8rem;
        }

        .user-stats {
            display: flex;
            justify-content: space-around;
            width: 100%;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.12);
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--accent-gold);
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .player-widget h3 {
            font-size: 1.05rem;
            margin-bottom: 10px;
            color: var(--accent-gold);
        }

        .widget-date {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .time-display {
            font-size: 1.9rem;
            font-weight: bold;
            font-family: monospace;
            margin-bottom: 4px;
            color: #ffffff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .time-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 14px;
        }

        .progress-bar {
            width: 100%;
            height: 9px;
            background: rgba(26, 2, 8, 0.85);
            border-radius: 5px;
            overflow: hidden;
            margin-bottom: 18px;
            border: 1px solid rgba(255,255,255,0.12);
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.5);
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #d4a373 0%, var(--accent-gold) 100%);
            transition: width 0.4s ease;
        }

        .mini-buttons {
            display: flex;
            gap: 10px;
        }

        .mini-btn {
            flex: 1;
            height: 42px;
            background: linear-gradient(135deg, #3d0305 0%, #1c0106 100%);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 8px;
            color: white;
            cursor: pointer;
            transition: all 0.25s ease;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .mini-btn:hover {
            background: linear-gradient(135deg, #610a0d 0%, #3b0406 100%);
            border-color: var(--accent-gold);
            transform: translateY(-2px);
        }

        .article-card {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        @media (min-width: 600px) {
            .article-card {
                flex-direction: row;
            }
        }

        .article-img {
            flex: 1;
            background: #380507;
            border-radius: 10px;
            min-height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-style: italic;
            background-size: cover;
            background-position: center;
            box-shadow: 0 6px 15px rgba(0,0,0,0.4);
            border:
